name: iOS Unsigned Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned app
        working-directory: RestaurantDeals_iOS_Rebuild
        run: |
          set -euo pipefail
          xcodebuild             -project RestaurantDeals.xcodeproj             -scheme RestaurantDeals             -configuration Release             -sdk iphoneos             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build

      - name: Package unsigned IPA
        working-directory: RestaurantDeals_iOS_Rebuild
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/RestaurantDeals.app"

          test -d "$APP"

          rm -rf Payload
          rm -f RestaurantDeals-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/

          COPYFILE_DISABLE=1 zip -qry             RestaurantDeals-unsigned.ipa             Payload             -x '*/._*'             -x '__MACOSX/*'

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RestaurantDeals-unsigned
          path: RestaurantDeals_iOS_Rebuild/RestaurantDeals-unsigned.ipa
